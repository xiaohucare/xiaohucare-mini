# 项目相关配置
xiaohucare:
  # 名称
  name: xiaohucare-mini
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件上传路径（Windows 示例 D:/xiaohucare/uploadPath，Linux 示例 /home/xiaohucare/uploadPath）
  # 通过环境变量 XIAOHUCARE_PROFILE 指定，默认使用工作目录下的 uploadPath
  profile: ${XIAOHUCARE_PROFILE:./uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: ${CAPTCHA_TYPE:math}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: ${SERVER_PORT:8187}
  servlet:
    # 应用的访问路径
    context-path: ${SERVER_CONTEXT_PATH:/xiaohucare-api}
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置（默认 info，本地调试可通过环境变量临时开启 debug）
logging:
  level:
    com.xiaohucare: ${LOG_LEVEL_APP:info}
    org.springframework: ${LOG_LEVEL_SPRING:warn}
    dev.langchain4j: ${LOG_LEVEL_LANGCHAIN:info}
# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10
# Spring配置
spring:
  # 忽略反序列化时的未知字段（前端可能提交多余字段）
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  # 激活的配置文件
  profiles:
    active: druid,oss
  # 允许bean定义覆盖
  main:
    allow-bean-definition-overriding: true
    # 禁用数据库初始化依赖检测（解决 MyBatis-Plus 3.5.7 与 Spring Boot 3.x 兼容性）
    allow-circular-references: true
  sql:
    init:
      mode: never
  # HTTP编码配置
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 静态资源与模板缓存（生产建议开启缓存）
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: ${THYMELEAF_CACHE:true}
  mvc:
    throw-exception-if-no-handler-found: false
    static-path-pattern: "/static/**"
  # 服务模块
  devtools:
    restart:
      # 热部署开关（仅本地开发需要，默认关闭）
      enabled: ${DEVTOOLS_RESTART:false}
  # redis 配置 (Spring Boot 3.x 配置路径为 spring.data.redis)
  data:
    redis:
      # 地址
      host: ${REDIS_HOST:127.0.0.1}
      # 端口
      port: ${REDIS_PORT:6379}
      # 数据库索引
      database: ${REDIS_DATABASE:9}
      # 密码（无密码留空，生产环境必须通过环境变量注入）
      password: ${REDIS_PASSWORD:123456}
      # 连接超时时间
      timeout: 10s
      # 客户端名称
      client-name: ${spring.application.name:xiaohucare-mini}
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 5
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池的最大数据库连接数
          max-active: 20
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
        # 关闭超时时间
        shutdown-timeout: 100ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：必须通过环境变量 XIAOHUCARE_TOKEN_SECRET 注入（禁止提交真实值）
  # JJWT 要求 HMAC-SHA256 密钥长度 ≥ 32 字符；启动时会在 TokenService 中校验，
  # 生成示例：openssl rand -base64 48
  secret: ${XIAOHUCARE_TOKEN_SECRET:abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@}
  # 令牌有效期（默认30分钟）
  expireTime: ${TOKEN_EXPIRE_TIME:30}

# MyBatis配置
# mybatis
mybatis-plus:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.xiaohucare.framework.**.domain,com.xiaohucare.app.**.domain,com.xiaohucare.app.**.entity
  # 解决 Spring Boot 3.x 兼容性问题
  type-enums-package: com.xiaohucare.**.enums
  global-config:
      banner: false
      db-config:
        #主键类型  0:"数据库ID自增", 1:"不操作", 2:"用户输入ID",3:"数字型snowflake", 4:"全局唯一ID UUID", 5:"字符串型snowflake";
        id-type: auto
        #字段策略
        insert-strategy: not_null
        update-strategy: not_null
        select-strategy: not_null
        #驼峰下划线转换
        table-underline: true
        # 逻辑删除配置
        logic-delete-field: is_delete
        # 逻辑删除全局值（1表示已删除，这也是Mybatis Plus的默认配置）
        logic-delete-value: 1
        # 逻辑未删除全局值（0表示未删除，这也是Mybatis Plus的默认配置）
        logic-not-delete-value: 0
  configuration:
      map-underscore-to-camel-case: true
      cache-enabled: false  
# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Knife4j配置（接口文档）
knife4j:
    # 开启增强配置
    enable: ${KNIFE4J_ENABLE:true}
    # 生产环境必须设为 true，屏蔽 /doc.html 与 /v3/api-docs
    production: ${KNIFE4J_PRODUCTION:false}
    # 增强文档标题
    title: ${KNIFE4J_TITLE:小护康养 mini API 文档}
    # 增强文档描述
    description: 小护康养 mini接口文档
    # 增强文档版本
    version: 1.0
    # 增强文档联系人信息
    contact:
      name: ${KNIFE4J_CONTACT_NAME:xiaohucare}
      url: ${KNIFE4J_CONTACT_URL:https://www.xiaohucare.com}
      email: ${KNIFE4J_CONTACT_EMAIL:chongkelai#qq.com}
    # 全局参数配置
    global-operation-parameters:
      - name: Authorization
        description: JWT Token
        modelRef: string
        parameterType: header
        required: false
    # 文档页 Basic 认证（默认关闭；如开启必须通过环境变量注入强密码，不得使用默认值）
    basic-enable: ${KNIFE4J_BASIC_ENABLE:false}
    # Basic认证用户名
    basic-username: ${KNIFE4J_BASIC_USERNAME:admin}
    # Basic认证密码
    basic-password: ${KNIFE4J_BASIC_PASSWORD:123456}
    # 分组文档
    group:
      enable: true
      default-group: 小护康养 mini
      group-infos:
        - group-name: 小护康养 mini
          group-title: 小护康养 mini API
          group-description: 小护康养 mini接口文档

# 防盗链配置
referer:
  # 防盗链开关
  enabled: ${REFERER_ENABLED:false}
  # 允许的域名列表（部署时改为自有域名，多个逗号分隔）
  allowed-domains: ${REFERER_ALLOWED_DOMAINS:localhost,127.0.0.1}

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 定时任务配置
task:
  # 提成月度结算任务
  commission-settlement:
    # 任务开关（默认开启）
    enabled: true
  # 数据分析任务
  data-analytics:
    # 任务开关（默认开启）
    enabled: true
# 应用配置
app:
  # 平台小程序 AppID（用于微信授权登录，通过环境变量注入）
  platApp: ${WX_PLAT_APP:}
  # 测试支付开关（1 开启测试模式，生产必须为 0）
  testPay: ${APP_TEST_PAY:0}
  iswxqr: ${APP_WX_QR:1}